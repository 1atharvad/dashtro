# Render Blueprint for a Dashtro staging instance.
#
# Apply: Render dashboard → New → Blueprint → point at this repo (this file
# is auto-detected at the repo root). Render will create the web service and
# managed Postgres database below.
#
# Deploys the same pre-built image CI publishes on every push to main
# (ghcr.io/1atharvad/dashtro, public — no registry credentials needed).
# Note: pointing at the mutable `:latest` tag does NOT auto-redeploy when a
# new image is published — Render only auto-deploys on its own trigger
# (git push for source-based services). For an image-based service, use
# "Manual Deploy → Deploy latest image" in the Render dashboard after CI
# publishes, or wire up a Render Deploy Hook from the build-image workflow
# if you want that automated later.
#
# Postgres (not SQLite) so staging data survives redeploys/restarts — the
# free Postgres plan expires after 30 days and needs manually renewing (or
# upgrading) in the Render dashboard; that's a Render limit, not something
# this file can work around.
#
# JWT_SECRET_KEY is auto-generated by Render on first apply; DB_HOST/PORT/
# NAME/USER/PASSWORD are wired from the database below via `fromDatabase`,
# not hardcoded. CORS_ORIGINS and CMS_PUBLIC_URL are left blank —
# cross-origin/absolute-media-URL concerns only matter for browser access
# to the frontend; server-to-server API-key testing (MCP, curl, the dashtro
# CLI) isn't affected by either. Fill them in via the Render dashboard once
# you know the service's URL, if you also want to browse the CMS UI on this
# instance.

databases:
  - name: dashtro-staging-db
    plan: free
    databaseName: dashtro
    user: dashtro

services:
  - type: web
    name: dashtro-staging
    runtime: image
    image:
      url: ghcr.io/1atharvad/dashtro:latest
    plan: free
    healthCheckPath: /health
    envVars:
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DB_TYPE
        value: postgres
      - key: DB_HOST
        fromDatabase:
          name: dashtro-staging-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: dashtro-staging-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: dashtro-staging-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: dashtro-staging-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: dashtro-staging-db
          property: password
      - key: CORS_ORIGINS
        value: ""
      - key: CMS_PUBLIC_URL
        value: ""
