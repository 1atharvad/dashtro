services:

  nginx:
    image: nginx:alpine
    ports:
      - "7312:7312"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - public
      - internal

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    depends_on:
      - nginx
    restart: unless-stopped
    networks:
      - public

  backend:
    build:
      context: ./cms_backend
      dockerfile: Dockerfile
    # Run by default with SQLite. Use --profile postgres for PostgreSQL.
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    volumes:
      - ./cms_backend:/app
      # Mask two build-only outputs from the bind mount above: node_modules
      # (built for the host's OS/arch, wrong for Linux) and dist/ (compiled
      # only at image build time, never on the host).
      - /app/react_render/node_modules
      - /app/react_render/dist
      - uploads_data:/app/uploads
      # Lets the backup CLI (scripts/cms_schema.py) run directly inside the
      # container against the repo's backup/ dir — no docker cp needed. Pass
      # --backup-dir /app/backup when invoking via `docker compose exec`.
      - ./backup:/app/backup
    environment:
      # sqlite or postgres — set explicitly by `npm run dev`/`dev:postgres`
      # on the command line, not read from .env.
      DB_TYPE: ${DB_TYPE}
      # Only used when DB_TYPE=postgres.
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      # Only used when DB_TYPE=sqlite.
      SQLITE_DB_PATH: ${SQLITE_DB_PATH}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      DEBUG: ${DEBUG}
      CORS_ORIGINS: ${CORS_ORIGINS}
      CMS_PUBLIC_URL: ${CMS_PUBLIC_URL}
      # Password-reset email.
      EMAIL_PROVIDER: ${EMAIL_PROVIDER}
      EMAIL_FROM: ${EMAIL_FROM}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      RESEND_API_KEY: ${RESEND_API_KEY}
    networks:
      - internal

  frontend:
    build:
      context: ./cms-frontend
      dockerfile: Dockerfile
    volumes:
      - ./cms-frontend/src:/app/src
      - ./cms-frontend/public:/app/public
      - ./cms-frontend/index.html:/app/index.html
      - ./cms-frontend/vite.config.ts:/app/vite.config.ts
      - ./cms-frontend/tailwind.config.cjs:/app/tailwind.config.cjs
      - ./cms-frontend/postcss.config.cjs:/app/postcss.config.cjs
      - ./cms-frontend/tsconfig.json:/app/tsconfig.json
      - ./cms-frontend/tsconfig.app.json:/app/tsconfig.app.json
    environment:
      VITE_DEV_ALLOWED_HOST: ${VITE_DEV_ALLOWED_HOST}
    networks:
      - internal

  # Local PostgreSQL database for development (use --profile postgres to enable)
  postgres:
    profiles: ["postgres"]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

networks:
  public:
  internal:

volumes:
  uploads_data:
  postgres_data:
