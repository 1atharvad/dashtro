name: Build and push image

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/1atharvad/dashtro

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: cms-frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Lint frontend
        run: |
          cd cms-frontend
          npm ci --legacy-peer-deps
          npm run lint

      - name: Lint backend
        run: |
          pip install --quiet ruff black isort
          cd cms_backend
          python -m isort --check .
          python -m black --check .
          python -m ruff check .

  build-and-push:
    needs: lint
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            suffix: amd64
          # Native arm64 runner instead of QEMU emulation on ubuntu-latest —
          # emulated npm ci (native esbuild/rollup binaries under QEMU) was
          # prone to multi-hour hangs building this leg.
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dashtro
          push: true
          platforms: ${{ matrix.platform }}
          tags: ${{ env.IMAGE }}:${{ github.sha }}-${{ matrix.suffix }}
          cache-from: type=gha,scope=${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.suffix }}

  merge-manifest:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        run: |
          docker buildx imagetools create \
            -t ${{ env.IMAGE }}:latest \
            -t ${{ env.IMAGE }}:${{ github.sha }} \
            ${{ env.IMAGE }}:${{ github.sha }}-amd64 \
            ${{ env.IMAGE }}:${{ github.sha }}-arm64

  dashtro-release:
    # Publishes the root `dashtro` package (backup/restore CLI + cms_mcp) to
    # PyPI. Unlike sdk-release, there's no JS sibling to drive changesets off
    # of, so versioning here is just "bump pyproject.toml's version by hand
    # when you want a release" — skip-existing makes this a no-op otherwise.
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC trusted publishing to PyPI, no stored tokens
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build dashtro
        run: |
          python -m pip install --quiet build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  sdk-release:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # OIDC trusted publishing to npm + PyPI, no stored tokens
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            sdk/js/package-lock.json
            sdk/mcp/package-lock.json
          registry-url: https://registry.npmjs.org

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install JS SDK deps
        working-directory: sdk/js
        run: npm ci

      - name: Install MCP server deps
        working-directory: sdk/mcp
        run: npm ci

      # Trusted Publishing (OIDC) requires npm CLI >= 11.5.1; setup-node's
      # bundled npm on ubuntu-latest may be older. Pinned to the npm@11 line
      # (not `latest`) because npm 12 dropped support for Node 20.
      - run: npm install -g npm@11

      - name: Check for pending changesets
        id: changesets
        uses: ./.github/actions/check-pending-changeset
        with:
          working-directory: sdk/js

      - name: Check for pending sdk/mcp changesets
        id: mcp-changesets
        uses: ./.github/actions/check-pending-changeset
        with:
          working-directory: sdk/mcp

      - name: Version, sync, commit, and publish
        if: steps.changesets.outputs.pending == 'true'
        run: |
          cd sdk/js
          npm run version-packages
          cd ../..
          node sdk/scripts/sync-python-version.mjs

          NEW_VERSION=$(node -p "require('./sdk/js/package.json').version")
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sdk/js sdk/python
          git commit -m "sdk v$NEW_VERSION"

          cd sdk/js
          npm run release

          cd ../python
          python -m pip install --quiet build
          python -m build

      - name: Publish to PyPI
        if: steps.changesets.outputs.pending == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/python/dist

      - name: Version, commit, and publish @dashtro/mcp
        # sdk/mcp releases independently of sdk/js — (success() || failure())
        # keeps this from being skipped just because the unrelated sdk/js/PyPI
        # publish above it failed.
        if: (success() || failure()) && steps.mcp-changesets.outputs.pending == 'true'
        run: |
          cd sdk/mcp
          npm run version-packages
          cd ../..

          NEW_MCP_VERSION=$(node -p "require('./sdk/mcp/package.json').version")
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sdk/mcp
          git commit -m "@dashtro/mcp v$NEW_MCP_VERSION"

          cd sdk/mcp
          npm run release

      - name: Push version bump
        if: (success() || failure()) && (steps.changesets.outputs.pending == 'true' || steps.mcp-changesets.outputs.pending == 'true')
        run: git push origin HEAD:main --follow-tags
