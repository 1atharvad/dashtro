[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "dashtro"
version = "0.1.0"
requires-python = ">=3.10"
description = "DashTro CMS backup/restore CLI, plus a direct-database-access MCP server"
readme = "README.md"
license = "MIT"
authors = [{ name = "Atharva Devasthali" }]
dependencies = [
    "pydantic>=2.9",
    "python-decouple>=3.8",
    "PyJWT>=2.8",
    "psycopg2-binary>=2.9",
    "mcp>=1.0.0,<2.0.0",
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/1atharvad/dashtro"
Repository = "https://github.com/1atharvad/dashtro"

[project.scripts]
dashtro = "cms_backend.scripts.cms_schema:main"
dashtro-mcp = "cms_mcp.server:mcp.run"

[tool.setuptools.packages.find]
where = ["."]
# Only what cms_schema.py (the `dashtro` CLI) and cms_mcp/server.py (the
# `dashtro-mcp` MCP server) actually import — not routers/, tests/, or
# api/middleware/, which belong to the FastAPI app, not this CLI package.
include = [
    "cms_backend",
    "cms_backend.scripts",
    "cms_backend.api",
    "cms_backend.api.utils",
    "cms_backend.models",
    "cms_mcp",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "E402", "UP038"]

[tool.ruff.lint.isort]
known-first-party = ["cms_backend", "cms_mcp"]

# `pythonpath` puts cms_backend/ itself on sys.path (mirroring the Docker
# WORKDIR=/app layout) so that main.py's bare `from config import ...` /
# `from routers import ...` imports resolve the same way in tests as in prod.
[tool.pytest.ini_options]
pythonpath = ["cms_backend"]
testpaths = ["cms_backend/tests"]
